name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: Commitlint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check conventional commit format
        run: |
          git log --no-merges --format=%s origin/main..HEAD | while IFS= read -r msg; do
            echo "$msg" | grep -qE '^(feat|fix|docs|chore|refactor|test|perf|build|ci|revert|security|deps|style|release)(\(.+\))?!?: .+' || { echo "Invalid commit message: $msg"; exit 1; }
          done

  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Prepare local mw-gdrive module
        run: |
          mkdir -p ../mw-gdrive
          cat > ../mw-gdrive/go.mod <<'EOF'
          module github.com/A-L-L-A-H/mw-gdrive

          go 1.26.0

          require modernc.org/sqlite v1.34.3
          EOF
          cat > ../mw-gdrive/gdrive.go <<'EOF'
          package gdrive

          import (
              "context"
              "io"
          )

          type GDriveConfig struct {
              ClientID     string
              ClientSecret string
              RefreshToken string
              RootFolderID string
              RootFolder   string
              TokenURL     string
              APIBase      string
              UploadBase   string
          }

          type GDriveClient struct{}

          func NewGDriveClient(cfg GDriveConfig) *GDriveClient {
              return &GDriveClient{}
          }

          func (c *GDriveClient) Upload(ctx context.Context, name, mimeType string, data []byte) (string, error) {
              return "", nil
          }

          func (c *GDriveClient) Download(ctx context.Context, fileID string) (io.ReadCloser, int64, error) {
              return nil, 0, nil
          }

          func (c *GDriveClient) Exists(ctx context.Context, fileID string) (bool, error) {
              return false, nil
          }

          func (c *GDriveClient) Delete(ctx context.Context, fileID string) error {
              return nil
          }
          EOF

      - name: gofmt
        run: test -z "$(gofmt -l .)"

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -count=1 ./...

      - name: Coverage threshold
        run: |
          go test -coverprofile=coverage.out ./... >/dev/null
          total=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')
          awk -v v="$total" 'BEGIN{exit !(v>=60)}' || { echo "Coverage $total% < 60%"; exit 1; }

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Prepare local mw-gdrive module
        run: |
          mkdir -p ../mw-gdrive
          cat > ../mw-gdrive/go.mod <<'EOF'
          module github.com/A-L-L-A-H/mw-gdrive

          go 1.26.0

          require modernc.org/sqlite v1.34.3
          EOF
          cat > ../mw-gdrive/gdrive.go <<'EOF'
          package gdrive

          import (
              "context"
              "io"
          )

          type GDriveConfig struct {
              ClientID     string
              ClientSecret string
              RefreshToken string
              RootFolderID string
              RootFolder   string
              TokenURL     string
              APIBase      string
              UploadBase   string
          }

          type GDriveClient struct{}

          func NewGDriveClient(cfg GDriveConfig) *GDriveClient {
              return &GDriveClient{}
          }

          func (c *GDriveClient) Upload(ctx context.Context, name, mimeType string, data []byte) (string, error) {
              return "", nil
          }

          func (c *GDriveClient) Download(ctx context.Context, fileID string) (io.ReadCloser, int64, error) {
              return nil, 0, nil
          }

          func (c *GDriveClient) Exists(ctx context.Context, fileID string) (bool, error) {
              return false, nil
          }

          func (c *GDriveClient) Delete(ctx context.Context, fileID string) error {
              return nil
          }
          EOF

      - name: Install pinned gitleaks CLI
        shell: bash
        run: |
          set -euo pipefail
          version='8.30.1'
          archive="$RUNNER_TEMP/gitleaks_${version}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
            --output "$archive"
          expected='551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
          actual="$(sha256sum "$archive" | cut -d' ' -f1)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::gitleaks checksum mismatch: expected $expected, got $actual"
            exit 1
          fi
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          install -m 0755 "$RUNNER_TEMP/gitleaks" /usr/local/bin/gitleaks

      - name: Scan full history for secrets
        shell: bash
        run: |
          set -euo pipefail
          gitleaks git \
            --config .gitleaks.toml \
            --log-opts="--all" \
            --redact \
            --no-banner \
            --exit-code 1

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: Observability endpoints
        run: |
          grep -R --include='*.go' -E '/health|/metrics' . || { echo "No /health or /metrics endpoint found"; exit 1; }